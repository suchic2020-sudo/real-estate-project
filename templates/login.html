{% extends 'base.html' %}

{% block title %}Login | Apex Estates{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Sign In</h2>
        <p class="section-copy">Access your saved favorites and send enquiries directly from the platform.</p>

        <form method="POST">
            <input type="email" name="email" placeholder="Email address" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit" class="button">Login</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a></p>
    </div>
</div>
{% endblock %}
